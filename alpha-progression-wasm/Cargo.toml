[package]
name = "alpha-progression-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
alpha-progression    = { path = "../alpha-progression" }
serde                = { version = "1", features = ["derive"] }
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen   = "0.6"
js-sys               = "0.3"
hex                  = "0.4"
rand                 = "0.8"
getrandom            = { version = "0.2", features = ["js"] }
